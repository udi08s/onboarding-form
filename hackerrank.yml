
version: '2.0'

problem:
  title: "QA Assignment: Onboarding Form Testing with Playwright"
  description: "Write comprehensive end-to-end tests for an onboarding form component using Playwright. The form includes personal information fields with validation rules and Australian-specific requirements."
  difficulty: "Medium"
  time_limit: 180  # 3 hours in minutes
  
environment:
  runtime: "node18"
  package_manager: "npm"
  
files:
  readonly:
    - "package.json"
    - "playwright.config.js"
    - "app/"
    - "components/"
    - "public/"
    - "README.md"
    - "next.config.mjs"
    - ".next/"
    - "tsconfig.json"
    - "postcss.config.mjs"
    - "components.json"
  
  editable:
    - "tests/onboarding-form.spec.js"
  
  hidden:
    - "node_modules/"
    - ".git/"
    - "test-results/"
    - "playwright-report/"

setup:
  commands:
    - "npm install"
    - "npm run build"
    
test_setup:
  pre_test:
    - "npm run dev &"
    - "sleep 10"  # Wait for dev server to start
    - "npx playwright install"
  
  post_test:
    - "pkill -f 'npm run dev'"

scoring:
  type: "custom"
  total_points: 100
  
  test_cases:
    # Form Visibility and Initial State (15 points)
    - name: "Form Visibility Tests"
      points: 8
      command: "npx playwright test --grep 'should display all form fields'"
      timeout: 30
      
    - name: "Initial State Tests"
      points: 7
      command: "npx playwright test --grep 'should have correct initial state'"
      timeout: 30
    
    # Field Validation Tests (35 points)
    - name: "Name Fields Validation"
      points: 8
      command: "npx playwright test --grep 'should validate name fields'"
      timeout: 45
      
    - name: "Email Validation"
      points: 8
      command: "npx playwright test --grep 'should validate email field'"
      timeout: 45
      
    - name: "Phone Validation"
      points: 8
      command: "npx playwright test --grep 'should validate phone field'"
      timeout: 45
      
    - name: "Date of Birth Validation"
      points: 6
      command: "npx playwright test --grep 'should validate date of birth'"
      timeout: 45
      
    - name: "Company Field Validation"
      points: 5
      command: "npx playwright test --grep 'should validate company field'"
      timeout: 30
    
    # Dropdown Field Tests (20 points)
    - name: "State Dropdown Tests"
      points: 10
      command: "npx playwright test --grep 'should test state dropdown'"
      timeout: 45
      
    - name: "Gender Dropdown Tests"
      points: 10
      command: "npx playwright test --grep 'should test gender dropdown'"
      timeout: 45
    
    # Form Submission Tests (20 points)
    - name: "Valid Form Submission"
      points: 10
      command: "npx playwright test --grep 'should submit valid form successfully'"
      timeout: 60
      
    - name: "Invalid Form Submission"
      points: 5
      command: "npx playwright test --grep 'should prevent invalid form submission'"
      timeout: 45
      
    - name: "Loading and Success States"
      points: 5
      command: "npx playwright test --grep 'should show loading and success states'"
      timeout: 60
    
    # User Experience Tests (10 points)
    - name: "Real-time Error Clearing"
      points: 5
      command: "npx playwright test --grep 'should clear errors when typing'"
      timeout: 45
      
    - name: "Error Display and Styling"
      points: 5
      command: "npx playwright test --grep 'should display errors correctly'"
      timeout: 45

ide:
  layout:
    - type: "editor"
      files: 
        - "tests/onboarding-form.spec.js"
      default_file: "tests/onboarding-form.spec.js"
      width: 70
      
    - type: "preview"
      url: "http://localhost:3000"
      width: 30
      refresh_on_save: false
      
  editor_config:
    language: "javascript"
    theme: "vs-dark"
    font_size: 14
    tab_size: 2
    word_wrap: true
    minimap: false
    
