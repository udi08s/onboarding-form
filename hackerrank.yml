      })
      
      test('should show loading and success states', async ({ page }) => {
        // TODO: Test loading state during submission and success state after
        // - Submit valid form
        // - Verify button shows "Creating Profile..." and is disabled
        // - Wait for submission to complete
        // - Verify success state with welcome message
      })
    })

    test.describe('User Experience Tests', () => {
      test('should clear errors when typing', async ({ page }) => {
        // TODO: Test that error messages disappear when user starts typing
        // - Trigger validation error
