    })
  })

  // Helper functions you can use:
  
  async function fillFormField(page, label, value) {
    await page.fill(`[aria-label="${label}"]`, value)
  }

  async function selectDropdownOption(page, label, option) {
    await page.click(`[aria-label="${label}"]`)
    await page.click(`text=${option}`)
  }

  async function submitForm(page) {
    await page.click('button[type="submit"]')
  }

  async function expectErrorMessage(page, message) {
    await expect(page.locator(`text=${message}`)).toBeVisible()
  }

grading:
  auto_grading: true
  manual_review: false
  
  scoring_criteria:
    - name: "Test Completeness"
      weight: 30
      description: "Coverage of all specified test scenarios"
      
    - name: "Test Quality"
      weight: 25
      description: "Well-structured, readable, and maintainable tests"
      
    - name: "Assertion Accuracy"
      weight: 20
      description: "Proper use of Playwright assertions and selectors"
      
    - name: "Edge Case Coverage"
      weight: 15
      description: "Testing boundary conditions and error states"
      
    - name: "Code Organization"
      weight: 10
      description: "Logical grouping and clear test descriptions"

constraints:
  memory_limit: "2GB"
  execution_time_limit: 300  # 5 minutes per test case
  
sample_solution:
  file: "tests/solutions/onboarding-form.solution.spec.js"
  hidden: true

hints:
  - "Use aria-label selectors for reliable element selection (e.g., 'First Name *', 'Email Address *')"
  - "Test both positive and negative scenarios for each validation rule"
  - "Don't forget to test dropdown selections and form submission states"
  - "Consider real user workflows when writing your tests"
  - "Use beforeEach hooks to set up common test preconditions"
  - "The form has specific Australian phone number validation rules"
  - "Date of birth has age restrictions (13-120 years old)"
  - "Company field is optional but has minimum length validation when provided"